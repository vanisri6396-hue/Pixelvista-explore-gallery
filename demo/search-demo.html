<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<section class="container" style="padding:100px 0;">

<div class="search">

    <form class="search__form">

        <span class="search__icon">
            🔍
        </span>

        <input
            class="search__input"
            type="text"
            placeholder="Search nature, cars, space..."
        >

        <span class="search__shortcut">

            Ctrl + K

        </span>

        <button
            class="search__clear"
            type="button">

            ✕

        </button>

        <button
            class="search__voice"
            type="button">

            🎤

        </button>

        <button
            class="search__button"
            type="submit">

            Search

        </button>

    </form>

    <div class="search__dropdown">

        <div class="search__item">

            🌄 Nature

        </div>

        <div class="search__item">

            🚀 Space

        </div>

        <div class="search__item">

            🏙 Architecture

        </div>

        <div class="search__item">

            🦁 Wildlife

        </div>

    </div>

</div>

</section>

</body>
</html>
