<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<section class="container" style="padding:80px; display:grid; gap:2rem; max-width:700px;">

<div class="input">

<label class="input__label">

Full Name

</label>

<div class="input__wrapper">

<span class="input__icon">

👤

</span>

<input

class="input__field"

type="text"

placeholder="Enter your full name"

>

</div>

<p class="input__helper">

This will appear on your profile.

</p>

</div>


<div class="input input--success">

<label class="input__label">

Email

</label>

<div class="input__wrapper">

<span class="input__icon">

📧

</span>

<input

class="input__field"

type="email"

placeholder="john@example.com"

>

</div>

<p class="input__helper">

Looks good!

</p>

</div>


<div class="input input--error">

<label class="input__label">

Password

</label>

<div class="input__wrapper">

<span class="input__icon">

🔒

</span>

<input

class="input__field"

type="password"

placeholder="Minimum 8 characters"

>

<span class="input__toggle">

👁

</span>

</div>

<p class="input__helper">

Password is too short.

</p>

</div>

</section>
</body>
</html>
